name: rhetor

services:
  postgres:
    image: postgres:17-alpine
    container_name: rhetor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rhetor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhetor}
      POSTGRES_DB: ${POSTGRES_DB:-rhetor}
      # Name of the extra database created for the test suite (see init/01-init.sql)
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-rhetor_test}
      # Explicit UTF-8; collation stays at the image default (C)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, only when pgdata is empty (first `up` after a fresh volume)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rhetor} -d ${POSTGRES_DB:-rhetor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Browser-based DB client. Not started by default — `docker compose --profile tools up -d`
  adminer:
    image: adminer:5
    container_name: rhetor-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: rhetor_pgdata
